<!DOCTYPE html>
<html>
<head><title>Test Speech Voices</title></head>
<body>
<button onclick="checkVoices()">Check Voices</button>
<pre id="log"></pre>
<script>
function checkVoices() {
  const voices = window.speechSynthesis.getVoices();
  document.getElementById('log').textContent = JSON.stringify(voices.map(v => ({
    name: v.name, lang: v.lang, default: v.default
  })), null, 2);
}
if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = checkVoices;
}
</script>
</body>
</html>
