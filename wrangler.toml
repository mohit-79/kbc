name = "surkbc"
main = "worker.js"
compatibility_date = "2024-10-01"

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "surkbc-db"
database_id = "surkbc-d1-local"

# Cloudflare Pages Routing (Serves kbc-game frontend directly)
[site]
bucket = "./"
include = [
  "index.html",
  "styles.css",
  "app.js",
  "questions.js",
  "audio.js",
  "musicFacts.json",
  "manifest.webmanifest",
  "icon-180.png",
  "apple-touch-icon.png",
  "friend.html",
  "friend.js",
  "images/**",
  "icons/**"
]

# Cloudflare Durable Objects Binding for Real-time Push & Signaling
[[durable_objects.bindings]]
name = "SESSION_ROOM"
class_name = "SessionRoom"

[[migrations]]
tag = "v1"
new_classes = ["SessionRoom"]

