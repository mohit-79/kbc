name = "surkbc"
main = "worker.js"
compatibility_date = "2024-10-01"

# Custom Domain Routing
routes = [
  { pattern = "kbc.harjani.me/*", zone_name = "harjani.me" }
]
workers_dev = true

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "surkbc-db"
database_id = "21ef8058-bbc7-4cf0-b728-849e467704e0"

# Static Assets configuration (Cloudflare Workers Static Assets)
[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"

# Cloudflare Durable Objects Binding for Real-time Push & Signaling
[[durable_objects.bindings]]
name = "SESSION_ROOM"
class_name = "SessionRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionRoom"]


# Optional Environment Variables for Automated WhatsApp
[vars]
WHATSAPP_GATEWAY_URL = "https://7107.api.greenapi.com/waInstance710722761539"
WHATSAPP_GATEWAY_TOKEN = "7137ee063b2f4f23b6bfaff096bb168afca7b3498c70490294"
TWILIO_ACCOUNT_SID = ""
TWILIO_AUTH_TOKEN = ""
TWILIO_FROM_PHONE = ""


